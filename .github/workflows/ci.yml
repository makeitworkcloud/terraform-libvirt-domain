name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/makeitworkcloud/tfroot-runner:latest
    steps:
      - name: Mark test run in progress
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- terraform-module-ci-status -->';
            const workflowUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            let previous = '';
            if (existing) {
              if (existing.body.includes('this comment will be updated when the run completes')) {
                const match = existing.body.match(/<details><summary>Previous run output<\/summary>\n\n([\s\S]*)\n\n<\/details>\s*$/);
                previous = match ? match[1].trim() : '';
              } else {
                previous = existing.body.replace(marker, '').trim();
              }
            }
            const parts = [
              marker,
              '#### OpenTofu Test',
              '',
              'OpenTofu test is in progress; this comment will be updated when the run completes.',
              '',
              `[View the workflow run](${workflowUrl}).`,
            ];
            if (previous) {
              parts.push('', '<details><summary>Previous run output</summary>', '', previous, '', '</details>');
            }
            const body = parts.join('\n');
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Initialize OpenTofu
        id: initialize
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          tofu init -backend=false 2>&1 | tee initialize.log

      - name: Run tests
        id: validation
        if: always() && steps.initialize.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          SKIP=no-commit-to-branch make test 2>&1 | tee validation.log

      - name: Report validation on pull request
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          INITIALIZE_OUTCOME: ${{ steps.initialize.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-module-ci-status -->';
            const outcomes = {
              checkout: process.env.CHECKOUT_OUTCOME,
              'OpenTofu initialization': process.env.INITIALIZE_OUTCOME,
              validation: process.env.VALIDATION_OUTCOME,
            };
            const failedSteps = Object.entries(outcomes)
              .filter(([, outcome]) => outcome === 'failure')
              .map(([step]) => step);
            const failed = failedSteps.length > 0;
            const workflowUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const maxLength = 12000;
            const output = ['initialize.log', 'validation.log']
              .filter(fs.existsSync)
              .map((file) => `### ${file}\n${fs.readFileSync(file, 'utf8')}`)
              .join('\n\n')
              .replace(/\u001b\[[0-?]*[ -/]*[@-~]/g, '')
              .replace(/\b(?:gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})\b/g, '***REDACTED***')
              .replace(/````/g, '\\`\\`\\`\\`') || 'No validation output was captured.';
            const excerpt = output.length > maxLength ? output.slice(-maxLength) : output;
            const status = failed
              ? `OpenTofu test failed (failed steps: ${failedSteps.join(', ')}).`
              : 'OpenTofu test passed.';
            const body = [
              marker,
              '#### OpenTofu Test',
              '',
              status,
              '',
              `[View the workflow run](${workflowUrl}).`,
              '',
              '<details><summary>View run output</summary>',
              '',
              '````text',
              excerpt,
              '````',
              '',
              '</details>',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Mark validation failed
        if: >-
          always() &&
          (steps.checkout.outcome == 'failure' ||
           steps.initialize.outcome == 'failure' ||
           steps.validation.outcome == 'failure')
        run: exit 1

  release:
    runs-on: ubuntu-latest
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
