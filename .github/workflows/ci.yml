name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/makeitworkcloud/tfroot-runner:latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Initialize OpenTofu
        id: initialize
        continue-on-error: true
        run: |
          set -o pipefail
          tofu init -backend=false 2>&1 | tee initialize.log

      - name: Run tests
        id: validation
        if: always() && steps.initialize.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          SKIP=no-commit-to-branch make test 2>&1 | tee validation.log

      - name: Report validation on pull request
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VALIDATION_FAILED: ${{ steps.initialize.outcome == 'failure' || steps.validation.outcome == 'failure' }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-module-ci-status -->';
            const failed = process.env.VALIDATION_FAILED === 'true';
            const workflowUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body;
            if (failed) {
              const maxLength = 12000;
              const log = ['initialize.log', 'validation.log']
                .filter(fs.existsSync)
                .map((file) => `### ${file}\n${fs.readFileSync(file, 'utf8')}`)
                .join('\n\n')
                .replace(/\b(?:gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})\b/g, '***REDACTED***')
                .replace(/```/g, '\\`\\`\\`');
              const excerpt = log.length > maxLength ? log.slice(-maxLength) : log;
              body = `${marker}\n## Terraform module CI failed\n\n[View the workflow run](${workflowUrl})\n\n<details><summary>Validation output (redacted, last ${maxLength} characters)</summary>\n\n\`\`\`text\n${excerpt}\n\`\`\`\n</details>`;
            } else {
              body = `${marker}\n## Terraform module CI passed\n\nOpenTofu initialization and validation passed. [View the workflow run](${workflowUrl}).`;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Mark validation failed
        if: >-
          always() &&
          (steps.initialize.outcome == 'failure' || steps.validation.outcome == 'failure')
        run: exit 1

  release:
    runs-on: ubuntu-latest
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
