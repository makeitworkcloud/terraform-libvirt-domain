# Automatic release CD for the Terraform module.
#
# googleapis/release-please derives the next SemVer version from Conventional
# Commit history (fix: -> patch, feat: -> minor, ! or BREAKING CHANGE ->
# major) and maintains a release pull request (changelog and version bump)
# against main. The Git tag and GitHub release are created only after the ci
# workflow succeeds for the exact commit at the tip of main:
#
# 1. A push to main (for example merging the release pull request) runs ci.
# 2. On ci completion this workflow starts (workflow_run gate).
# 3. The guard step fails the run unless the green ci run tested the current
#    main tip, so nothing is tagged from a commit whose ci has not passed;
#    when the guard fails, the token and release steps below it are skipped
#    automatically.
# 4. release-please then updates the release pull request or, when the merged
#    commit is the release pull request itself, creates the vX.Y.Z Git tag
#    and the GitHub release using a short-lived GitHub App installation
#    token. The default GITHUB_TOKEN cannot open the release pull request
#    under this organization's workflow token policy.
#
# The App token is minted from the organization's chart updater GitHub App
# (manual owner configuration, not Terraform-managed) and is scoped to
# owner makeitworkcloud / repositories terraform-libvirt-domain with Contents
# and Pull requests write only. The installation scope is currently
# unverified: rollout stays blocked until an organization owner confirms the
# repository is selected (Only select repositories), and token minting fails
# if the repository is not selected. Unlike GITHUB_TOKEN, App-created tags
# can trigger workflow runs; ci does not listen for tags and release-please
# is the single release producer, so the tag does not re-enter CI.
#
# workflow_run uses the default-branch copy of this file, so activation starts
# once this change reaches main.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

# The job's GITHUB_TOKEN only reads branch state for the guard step. All
# writes go through the App installation token created below.
permissions:
  contents: read

concurrency:
  group: module-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Verify the successful ci run tested the current main commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const ciHead = context.payload.workflow_run.head_sha;
            const {data: branch} = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            if (branch.commit.sha !== ciHead) {
              core.setFailed(
                'ci passed for ' + ciHead.slice(0, 7) +
                ' but main is at ' + branch.commit.sha.slice(0, 7) +
                '; the newer commit releases after its own ci run succeeds'
              );
            }

      - name: Create scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: "4745727"
          private-key: ${{ secrets.CHART_UPDATER_GITHUB_APP_PRIVATE_KEY }}
          owner: makeitworkcloud
          repositories: terraform-libvirt-domain
          permission-contents: write
          permission-pull-requests: write

      # The signed annotated tag v0.1.0 points at 218dd6, the pre-rewrite
      # twin of the tree-identical reachable commit fd84957; release-please
      # skips release SHAs that are not reachable from main, so the baseline
      # is anchored by release-please-config.json (last-release-sha) and
      # .release-please-manifest.json (current version 0.1.0). The existing
      # tag and release are preserved. release-type must stay unset here:
      # the action bypasses the config file when release-type is present.
      - name: Conventional Commits release (SemVer, tag, and GitHub release)
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
